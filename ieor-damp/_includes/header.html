<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">IE</span>
      <span class="brand-text">IEOR <strong>DAMP</strong></span>
    </a>
    <button class="icon-btn nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <div class="nav-group">
        <span class="nav-label">Guide</span>
        {% for item in site.data.nav.guide %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.section == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </div>
      <div class="nav-group">
        <span class="nav-label">Common Room</span>
        {% for item in site.data.nav.common_room %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.section == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </div>
    </nav>
    <button class="icon-btn theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
      <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>
